data_config:
  data: "custom"
  #freq: "h"
  root_path: "data/long_term_forecast/exchange_rate/"
  data_path: "exchange_rate.csv"
  seq_len: 512
  label_len: 256
  pred_len: 96
  batch_size: 1
  num_workers: 2
  features: "M"
  enc_in: 8
  c_out: 8
  dyadic_order: 0
  censoring_method: ["kernel", "systemic"]
  censoring_quantile: 0.95
  max_test_batches: 200
  censoring_max_batch: 4
  censoring_n_representatives: 50
  device: "cuda:0"
  n_samples: 10
  quantiles: [0.05, 0.15, 0.25, 0.35, 0.45, 0.55, 0.65, 0.75, 0.85, 0.95]

models:
  # 1. Chronos 2 (Amazon)
  - name: "Chronos-2"
    active: true
    module: "adapters"
    class: "ChronosAdapter"
    params:
      model_path: "amazon/chronos-2"
      device: "cuda:0"

  # 2. Moirai
  - name: "Moirai"
    active: true
    module: "adapters"
    class: "MoiraiAdapter"
    params:
      model_path: "Salesforce/moirai-1.0-R-small"
      device: "cuda:1"

  # 3. MoiraiMoE (disabled: only supports patch_size=16, OOMs on 862-variate data)
  - name: "MoiraiMoE"
    active: false
    module: "adapters"
    class: "MoiraiMoEAdapter"
    params:
      model_path: "Salesforce/moirai-moe-1.0-R-small"
      device: "cuda:2"


